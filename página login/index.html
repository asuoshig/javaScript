<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https:/unpkg.com/boxicons@2.1.1/css/boxicons.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <span>Cadastro de funcionários</span>
            <button onclick="openModal()" id="new"><i>incluir</i></button>
        </div>
        <div class="divTable">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>função</th>
                        <th>Salario</th>
                        <th>Matrícula</th>
                        <th class="acao">Editar</th>
                        <th class="acao">Excluir</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
        <div class="modal-container">
            <div class="modal">
                <form>
                    <label for="m-nome">nome</label>
                    <input id="m-nome" type="text" required/>

                    <label for="m-funcao">função</label>
                    <input id="m-funcao" type="text" required/>

                    <label for="m-matricula">Matricula</label>
                    <input id="m-matricula" type="number" required/>

                    <label for="m-salario">Salário</label>
                    <input id="m-salario" type="text" required/>
                    <button id="btnSalavr">Salvar</button>
                </form>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
